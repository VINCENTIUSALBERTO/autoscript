# ==============================================================================
# VPS Autoscript Main Configuration
# ==============================================================================

# VPS Settings
VPS_DOMAIN=""
VPS_IP=""

# Telegram Settings
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# V2Ray Settings
V2RAY_PORT_VMESS="443"
V2RAY_PORT_VLESS="8443"
V2RAY_PATH_VMESS="/vmess"
V2RAY_PATH_VLESS="/vless"
V2RAY_CONFIG_DIR="/etc/v2ray"
V2RAY_CERT_FILE="/etc/v2ray/v2ray.crt"
V2RAY_KEY_FILE="/etc/v2ray/v2ray.key"

# DNS Settings
PRIMARY_DNS="8.8.8.8"
SECONDARY_DNS="8.8.4.4"

# Backup Settings
BACKUP_DIR="/root/backup"
BACKUP_RETENTION_DAYS="30"

# Webmin Settings
WEBMIN_PORT="10000"

# Logging
LOG_FILE="/var/log/autoscript.log"
LOG_LEVEL="INFO"
DEBUG="0"

# Script Version
SCRIPT_VERSION="1.0.0"
SCRIPT_AUTHOR="VPS Autoscript"

# Accounts Directory
ACCOUNTS_DIR="/etc/autoscript/accounts"
